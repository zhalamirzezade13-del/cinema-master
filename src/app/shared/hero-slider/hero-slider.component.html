<section class="hero">
    <img
      class="hero-background"
      src="images/banners/avatar-fire-and-ash.jpeg"
      alt=""
      aria-hidden="true"
    >
    <div class="hero-content">

        <span class="rating">
            ⭐️ 9 IMDb
        </span>

        <h1>{{'hero.title' | transloco }}</h1>

        <div class="movie-info">
      <span>{{ 'hero.action' | transloco }}</span>
      <span>{{ 'hero.adventure' | transloco }}</span>
      <span>{{ 'hero.fantasy' | transloco }}</span>
    </div>

        <p>
            
            {{'hero.description' | transloco }}
        </p>

      <div class="release-date">
      {{ 'hero.inCinemas' | transloco }}:
      <span>{{ 'hero.releaseDate' | transloco }}</span>
    </div>

        <div class="buttons">
            <button class="book-btn" [routerLink]="['/movies']">{{ 'hero.bookTickets' | transloco }}</button>
            <button type="button" class="watch-btn" (click)="openTrailer()">{{ 'hero.watch' | transloco }}</button>
        </div>

    </div>
</section>
<dialog #trailerDialog class="hero-trailer-dialog" [attr.aria-label]="'hero.watch' | transloco" (close)="trailerOpen = false">
  <button type="button" class="trailer-close" (click)="closeTrailer()" [attr.aria-label]="'movieDetail.closeTrailer' | transloco">×</button>
  <div class="hero-trailer-frame">
    <iframe *ngIf="trailerOpen" src="https://www.youtube-nocookie.com/embed/y35F2nMfVwY" [title]="'hero.watch' | transloco" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
  </div>
</dialog>
