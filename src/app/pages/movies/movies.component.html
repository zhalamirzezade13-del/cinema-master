<section class="movies-page">
  <div class="page-heading">
    <p class="eyebrow">
      {{ 'movies.inTheatres' | transloco }}
    </p>

    <h1>
      {{ 'movies.title' | transloco }}
    </h1>

    <p>
      {{ 'movies.description' | transloco }}
    </p>
  </div>

  <p *ngIf="loading">
    Filmlər yüklənir...
  </p>

  <p *ngIf="errorMessage">
    {{ errorMessage }}
  </p>

  <div class="movie-grid" *ngIf="!loading && !errorMessage">
    <app-movie-card
      *ngFor="let movie of movies"
      [movie]="movie">
    </app-movie-card>
  </div>
</section>
